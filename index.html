<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>LIRA — доступ по паролю</title>
<style>
:root{--bg:#eef2f1;--panel:#f9fbfa;--line:#d3dcd9;--ink:#15211d;--muted:#5b6b66;--accent:#0d7a6a;--loss:#b3412c;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0e1513;--panel:#151f1c;--line:#26332f;--ink:#e2ebe7;--muted:#93a39e;--accent:#3fc2a8;--loss:#ee7a62;color-scheme:dark}}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;padding:16px}
form{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:24px;width:100%;max-width:360px;display:flex;flex-direction:column;gap:12px}
h1{font-size:18px;margin:0}p{margin:0;color:var(--muted);font-size:13px}
input{font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
button{font:inherit;font-weight:600;padding:10px;border:0;border-radius:8px;background:var(--accent);color:var(--bg);cursor:pointer}
button:disabled{opacity:.6}#err{color:var(--loss);font-size:13px;min-height:1em}
input:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
</style></head><body>
<form id="f"><h1>Калькулятор выхода в ноль LIRA</h1><p>Страница зашифрована. Введите пароль, который вам передали.</p>
<label for="pw" style="font-size:13px">Пароль</label><input id="pw" type="password" autocomplete="current-password" required autofocus>
<button id="go" type="submit">Открыть</button><div id="err" role="alert"></div></form>

    const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(document.getElementById('pw').value),'PBKDF2',false,['deriveKey']);
    const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(P.s),iterations:P.n,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
    const html=new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(P.i)},key,b64(P.c)));
    document.open();document.write(html);document.close();
  }catch(x){err.textContent='Неверный пароль. Проверьте раскладку и попробуйте ещё раз.';btn.disabled=false;btn.textContent='Открыть';}
});
</script></body></html>
